plugins {
    id "com.android.application"
}

android {
    namespace "com.mike.volumeguard"
    compileSdk 37

    defaultConfig {
        applicationId "com.mike.volumeguard"
        minSdk 29
        targetSdk 37
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
